<div class="admin-users-container">
    <div class="page-header">
        <h2>User Management</h2>
        <p>Manage platform accounts, roles, and access statuses.</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-state">
        <div class="spinner"></div>
        <p>Loading users...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="errorMessage" class="error-message">
        <i class="icon">⚠️</i> {{ errorMessage }}
    </div>

    <!-- Users Grid -->
    <div *ngIf="!isLoading && !errorMessage" class="users-grid">
        <div class="user-card" *ngFor="let user of users">
            <div class="user-card-header">
                <div class="role-icon" [title]="user.roleType">{{ getRoleIcon(user.roleType) }}</div>
                <span class="status-badge" [ngClass]="isUserActive(user) ? 'active' : 'suspended'">
                    {{ isUserActive(user) ? 'Active' : 'Suspended' }}
                </span>
            </div>
            
            <div class="user-details">
                <h3 class="user-email">{{ user.email }}</h3>
                <p class="user-role">{{ user.roleType | titlecase }}</p>
                <p class="user-meta" *ngIf="user.storeId">Store ID: {{ user.storeId }}</p>
            </div>
            
            <div class="action-footer">
                <button class="status-btn" [ngClass]="isUserActive(user) ? 'btn-suspend' : 'btn-activate'" 
                    (click)="toggleUserStatus(user)"
                    [disabled]="user.email === currentUserEmail"
                    [title]="user.email === currentUserEmail ? 'You cannot suspend your own account' : ''">
                    {{ isUserActive(user) ? 'Suspend' : 'Activate' }}
                </button>
                <button class="delete-btn" 
                    (click)="deleteUser(user.id)"
                    [disabled]="user.email === currentUserEmail"
                    [title]="user.email === currentUserEmail ? 'You cannot delete your own account' : ''">
                    <i class="icon">🗑️</i>
                </button>
            </div>
        </div>
    </div>
</div>
