<!-- Floating Chat Bubble -->
<button class="chat-fab" (click)="toggleChat()" [class.open]="isOpen">
    @if (!isOpen) {
    <span class="fab-icon">💬</span>
    } @else {
    <span class="fab-icon">✕</span>
    }
</button>

<!-- Chat Window -->
@if (isOpen) {
<div class="chat-window">
    <div class="chat-header">
        <div class="header-info">
            <span class="bot-avatar">🤖</span>
            <div>
                <h4>AI Product Assistant</h4>
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
        </div>
        <button class="close-btn" (click)="toggleChat()">✕</button>
    </div>

    <div class="chat-messages" #messagesContainer>
        @for (msg of messages; track msg.timestamp) {
        <div class="message" [class.user]="msg.role === 'user'" [class.ai]="msg.role === 'ai'"
            [class.system]="msg.role === 'system'">
            @if (msg.role === 'ai') {
            <span class="msg-avatar">🤖</span>
            }
            <div class="msg-bubble">
                <div class="msg-content" [innerHTML]="formatContent(msg)"></div>
                <span class="msg-time">
                    {{ msg.timestamp | date:'HH:mm' }}
                </span>
            </div>
        </div>
        }

        @if (isTyping) {
        <div class="message ai">
            <span class="msg-avatar">🤖</span>
            <div class="msg-bubble typing">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
        }
    </div>

    <div class="chat-input">
        <textarea [(ngModel)]="userInput" (keydown)="onKeyDown($event)" (input)="autoResize($event)"
            placeholder="Ask about your products..." [disabled]="isTyping" maxlength="500" rows="1"></textarea>
        <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping">
            ➤
        </button>
    </div>
</div>
}
