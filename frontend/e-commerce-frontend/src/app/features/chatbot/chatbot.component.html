<!-- ── Floating Action Button ── -->
<button class="chat-fab" (click)="toggleChat()" [class.open]="isOpen" aria-label="Toggle AI Assistant">
  @if (!isOpen) {
    <span class="fab-icon">💬</span>
  } @else {
    <span class="fab-icon">✕</span>
  }
</button>

<!-- ── Chat Window ── -->
@if (isOpen) {
<div class="chat-window">

  <!-- Header -->
  <div class="chat-header">
    <div class="header-info">
      <div class="bot-avatar-wrapper">
        <span class="bot-avatar">🤖</span>
        <span class="online-ring"></span>
      </div>
      <div class="header-text">
        <h4>AI Product Assistant</h4>
        <div class="status-line">
          <span class="status-dot"></span>
          <span class="status-text">Online · Ready to help</span>
        </div>
      </div>
    </div>
    <button class="close-btn" (click)="toggleChat()" aria-label="Close chat">✕</button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #messagesContainer>
    @for (msg of messages; track msg.timestamp) {
      <div class="message"
        [class.user]="msg.role === 'user'"
        [class.ai]="msg.role === 'ai'"
        [class.system]="msg.role === 'system'">

        @if (msg.role === 'ai') {
          <div class="msg-avatar-wrap">🤖</div>
        }

        <div class="msg-bubble">
          <div class="msg-content" [innerHTML]="formatContent(msg)"></div>
          <span class="msg-time">{{ msg.timestamp | date:'HH:mm' }}</span>
        </div>
      </div>
    }

    @if (isTyping) {
      <div class="message ai typing-wrap">
        <div class="msg-avatar-wrap">🤖</div>
        <div class="typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    }
  </div>

  <!-- Input -->
  <div class="chat-input">
    <textarea
      [(ngModel)]="userInput"
      (keydown)="onKeyDown($event)"
      (input)="autoResize($event)"
      placeholder="Ask about products, prices, orders..."
      [disabled]="isTyping"
      maxlength="500"
      rows="1">
    </textarea>
    <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput.trim() || isTyping" aria-label="Send">
      ➤
    </button>
  </div>

</div>
}
