spring.application.name=ecommerce-backend

# database connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}

spring.datasource.hikari.connection-test-query=SELECT 1

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000

spring.jpa.hibernate.ddl-auto=update

# SQL sorgularini konsolda görmek icin
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Veritabani lehcesi (Dialect)
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# JWT Ayari
jwt.secret=${JWT_SECRET}
# 15 dakika
jwt.expiration=900000
# 3 gün
jwt.refresh-token.expiration=259200000

# Swagger/OpenAPI Path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Gemini API Key
google.gemini.api.key=${GEMINI_API_KEY}

# CORS Settings
app.cors.allowed-origins=http://localhost:4200


# Mail Settings
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=noreply@ecommerce.com
app.mail.base-url=http://localhost:4200

# Stripe Settings
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET_KEY}